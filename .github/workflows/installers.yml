name: Installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,appimage
            name: linux
          - os: windows-latest
            bundles: nsis
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "*"
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          path: src
      - name: Upload installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Elle çalıştırınca sürüm package.json'dan okunur; sürüm yoksa oluşturulur.
          tag="${GITHUB_REF_NAME}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="v$(node -p "require('./src/src-tauri/tauri.conf.json').version")"
          fi
          notes_file="src/.github/release-notes/$tag.md"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            notes=(--generate-notes)
            [ -f "$notes_file" ] && notes=(--notes-file "$notes_file")
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Compass $tag" "${notes[@]}"
          elif [ -f "$notes_file" ]; then
            # Notlar sonradan düzeltilirse yeniden çalıştırmak sürüm sayfasını da günceller.
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file "$notes_file"
          fi
          files=()
          while IFS= read -r -d '' f; do
            files+=("$f")
          done < <(find dist -type f \( -name '*.AppImage' -o -name '*.deb' -o -iname '*setup*.exe' \) -print0)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no installers found" >&2
            exit 1
          fi
          printf '%s\n' "${files[@]}"
          gh release upload "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
