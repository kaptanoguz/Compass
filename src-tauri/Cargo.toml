[package]
name = "compass"
version = "2.0.0"
description = "Search, download, and play. qBittorrent does the transfer."
authors = ["kaptanoguz"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "compass_lib"
path = "src/lib.rs"

[[bin]]
name = "compass"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.9", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = { version = "2.3", features = ["deep-link"] }
tauri-plugin-deep-link = "2.4"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
fancy-regex = "0.14"
once_cell = "1"
indexmap = { version = "2", features = ["serde"] }
base64 = "0.22"
sha1 = "0.10"
sha2 = "0.10"
pbkdf2 = "0.12"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
encoding_rs = "0.8"
url = "2"
rust-embed = "8"
futures = "0.3"
tokio-stream = "0.1"
dirs = "5"
unicode-normalization = "0.1"
open = "5"
percent-encoding = "2"
bytes = "1"
log = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
